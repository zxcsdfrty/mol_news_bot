# 關聯度判斷與議題分類字典
#
# 計分方式（news_bot/classifier.py）：
#   每個關鍵字命中 → 加上 weight；出現在「標題」時 × title_multiplier
#   同一關鍵字只計一次（避免內文重複出現灌分）
#   總分 >= threshold 判定為「與勞動部相關」
#
# 調整建議：先以 threshold 8 試跑一週，檢視網頁上「低分被收錄 / 高分被漏掉」的案例再微調。

threshold: 8
title_multiplier: 2

# 機關與首長：直接點名，權重最高
core:
  weight: 10
  keywords:
    - 勞動部
    - 勞保局
    - 勞工保險局
    - 勞動力發展署
    - 勞發署
    - 職業安全衛生署
    - 職安署
    - 勞動基金運用局
    - 勞動基金局
    - 勞動及職業安全衛生研究所
    - 勞研所
    - 洪申翰          # 部長，人事異動時請更新
    - 勞動部長
    - 勞長

# 排除：外國機關或同名詞，出現時會把對應 core 命中扣回
# pattern → 要扣回的 core 關鍵字
exclude:
  - pattern: 美國勞動部
    cancels: 勞動部
  - pattern: 韓國雇用勞動部
    cancels: 勞動部
  - pattern: 雇用勞動部
    cancels: 勞動部
  - pattern: 中國人力資源
    cancels: 勞動部
  - pattern: 越南勞動部
    cancels: 勞動部

# 議題分類：key = 議題名稱（會存進資料庫 topics 欄位，網頁可篩選）
topics:
  勞工保險:
    weight: 5
    keywords: [勞保, 勞工保險, 勞保年金, 勞保破產, 勞保基金, 老年給付, 失能給付, 撥補勞保]
  勞工退休金:
    weight: 5
    keywords: [勞退, 勞工退休金, 勞退新制, 勞退舊制, 勞退基金, 自提, 退休準備金]
  薪資工時:
    weight: 5
    keywords: [基本工資, 最低工資, 最低工資法, 時薪, 月薪, 加班費, 工時, 例一休, 特休, 休假, 變形工時, 責任制, 國定假日]
  勞資關係:
    weight: 5
    keywords: [勞資爭議, 勞資協商, 罷工, 工會, 資遣, 裁員, 大量解僱, 無薪假, 減班休息, 積欠工資, 勞基法, 勞動基準法, 勞動檢查, 勞檢]
  職業安全:
    weight: 5
    keywords: [職災, 職業災害, 工安, 職安法, 職業安全, 墜落, 過勞, 職業病, 災保法, 勞工職業災害保險]
  就業服務:
    weight: 4
    keywords: [就業服務, 就服站, 失業率, 失業給付, 就業保險, 求職, 缺工, 徵才, 就業博覽會, 青年就業, 中高齡就業, 二度就業, 就業安定基金]
  職業訓練:
    weight: 4
    keywords: [職業訓練, 職訓, 技能檢定, 技術士, 產業人才投資, 在職訓練, 職能]
  移工:
    weight: 5
    keywords: [移工, 外籍勞工, 外勞, 印尼移工, 越南移工, 菲律賓移工, 泰國移工, 印度移工, 家事移工, 看護工, 仲介費, 直聘, 逃逸, 行蹤不明, 跨國勞動力]
  性別平等與育兒:
    weight: 4
    keywords: [育嬰留職停薪, 育嬰假, 育嬰津貼, 陪產假, 產假, 生理假, 家庭照顧假, 性騷擾, 職場霸凌, 性別工作平等法, 性平法]
  勞動權益其他:
    weight: 3
    keywords: [勞工, 勞動權益, 派遣, 外送員, 承攬, 非典型就業, 身心障礙就業, 原住民就業, 勞動條件]

# 輿情傾向（簡易詞典法，僅供參考，網頁會標示）
sentiment:
  negative: [批評, 抨擊, 不滿, 抗議, 陳情, 爭議, 違法, 裁罰, 罰鍰, 死亡, 喪命, 身亡, 破產, 跳票, 砲轟, 痛批, 質疑, 失職, 慘, 怒, 疏失, 漏洞, 弊案]
  positive: [上路, 加碼, 調漲, 補助, 放寬, 保障, 成效, 創新高, 獲獎, 協助, 媒合, 感謝, 好評, 提升, 新制, 擴大]
